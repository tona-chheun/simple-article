<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">

<head>
    <title>Chat</title>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow">

        <div class="border-b p-4">
            <h2 class="text-xl font-semibold">Spring Chat</h2>
        </div>

        <div id="messages" class="h-[500px] overflow-y-auto p-6 space-y-4 bg-gray-50"></div>
        <form id="chatForm" class="border-t p-4 flex gap-3">
            <input
                    id="messageInput"
                    type="text"
                    name="message"
                    autocomplete="off"
                    placeholder="Type your message..."
                    class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

            <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-lg">
                Send
            </button>
        </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
        let stompClient = null;
        const sender = "You";

        function connect() {
            const socket = new SockJS("/ws");
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function () {
                stompClient.subscribe("/topic/messages", function (response) {
                    const message = JSON.parse(response.body);
                    showMessage(message);
                });
            });
        }

        function sendMessage(event) {
            event.preventDefault();

            const input = document.getElementById("messageInput");
            const content = input.value.trim();

            if (!content) {
                return;
            }

            stompClient.send("/app/chat.send", {}, JSON.stringify({
                sender: sender,
                content: content
            }));

            input.value = "";
        }

        function showMessage(message) {
            const messages = document.getElementById("messages");

            const wrapper = document.createElement("div");
            wrapper.className = message.sender === sender
                ? "flex justify-end"
                : "flex justify-start";

            const bubble = document.createElement("div");
            bubble.className = message.sender === sender
                ? "max-w-xs px-4 py-2 rounded-lg shadow bg-blue-500 text-white"
                : "max-w-xs px-4 py-2 rounded-lg shadow bg-white border text-gray-800";

            bubble.innerHTML = `
                <div class="text-xs font-semibold mb-1">${message.sender}</div>
                <div>${message.content}</div>
                <div class="text-[10px] mt-2 opacity-70">${message.time}</div>
            `;

            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);

            messages.scrollTop = messages.scrollHeight;
        }

        document.getElementById("chatForm").addEventListener("submit", sendMessage);

        connect();
    </script>
</div>
</body>
</html>
