spring:
  application:
    name: ARTICLE-SERVICE
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

server:
  port: 8081

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html